<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Rock Paper Scissors</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="game-shell">
    <header>
      <h1>Rock Paper Scissors</h1>
      <p class="intro">Choose your move and see if you can beat the computer.</p>
    </header>

    <div id="buttons-container">
      <button id="rock">✊ Rock</button>
      <button id="paper">✋ Paper</button>
      <button id="scissors">✌️ Scissors</button>
    </div>

    <section id="result">Make your move!</section>
    <section id="score">You: 0 | Computer: 0</section>

    <p class="footer">Tap a button to play again.</p>
  </main>

  <script src="loyloy.js" defer></script>
</body>
</html>
